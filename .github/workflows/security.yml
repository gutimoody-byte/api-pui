name: Seguridad API PUI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  seguridad:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout código
      uses: actions/checkout@v3

    # 🔎 SAST con SonarQube Scanner
    - name: SAST - SonarQube
      uses: sonarsource/sonarcloud-github-action@master
      with:
        args: >
          -Dsonar.projectKey=tu_proyecto
          -Dsonar.organization=tu_org
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.login=${{ secrets.SONAR_TOKEN }}

    # 📦 SCA con OWASP Dependency-Check
    - name: SCA - OWASP Dependency-Check
      uses: dependency-check/Dependency-Check_Action@main
      with:
        project: "API-PUI"
        scan: "."
        format: "HTML"
        out: "reports/dependency-check"

    # 🌐 DAST con OWASP ZAP
    - name: DAST - OWASP ZAP Baseline Scan
      uses: zaproxy/action-baseline@v0.6.0
      with:
        target: "https://tu-api-publicada.com"
        rules: "zap-rules.tsv"
        cmd_options: "-a"
