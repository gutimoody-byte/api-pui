name: Seguridad Webhook PUI

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  seguridad:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout código
      uses: actions/checkout@8ade135a41bc03ea155e62e844d188df1ea18608

    # 🔎 SAST con Semgrep
    - name: Instalar Semgrep
      run: pip install semgrep

    - name: SAST - Semgrep
      run: semgrep --config=auto .

    # 📦 SCA con OWASP Dependency-Check
    - name: SCA - OWASP Dependency-Check
      uses: dependency-check/Dependency-Check_Action@<commit-sha>
      with:
        project: "Webhook-PUI"
        scan: "."
        format: "HTML"
        out: "reports/dependency-check"

    # 📤 Subir reporte de SCA como artefacto
    - name: Upload Dependency-Check report
      uses: actions/upload-artifact@<commit-sha>
      with:
        name: dependency-check-report
        path: reports/dependency-check
