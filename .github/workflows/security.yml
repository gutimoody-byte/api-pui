name: Seguridad Webhook PUI

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  seguridad:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout código
      uses: actions/checkout@v4

    # 🔎 SAST con Semgrep
    - name: Instalar Semgrep
      run: pip install semgrep

    - name: SAST - Semgrep
      run: semgrep --config=auto .

    # 📦 SCA con OWASP Dependency-Check
    - name: SCA - OWASP Dependency-Check
      uses: dependency-check/Dependency-Check_Action@main
      with:
        project: "Webhook-PUI"
        scan: "."
        format: "HTML"
        out: "reports/dependency-check"

    # 📤 Subir reporte de SCA como artefacto
    - name: Upload Dependency-Check report
      uses: actions/upload-artifact@v4
      with:
        name: dependency-check-report
        path: reports/dependency-check

    # 🌐 DAST con OWASP ZAP
    - name: DAST - OWASP ZAP Baseline
      uses: zaproxy/action-baseline@v0.9.0
      with:
        target: "https://www.fnhermes.com.mx/pui/api/pui/login"
        cmd_options: "-a"

    # 📤 Subir reporte de ZAP como artefacto
    - name: Upload ZAP Report
      uses: actions/upload-artifact@v4
      with:
        name: zap-report
        path: report_html.html
