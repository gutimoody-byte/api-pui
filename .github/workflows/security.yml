name: Seguridad API PUI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  seguridad:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout código
      uses: actions/checkout@v3

    # 🔎 SAST con SonarQube Scanner
    - name: SAST - SonarQube
      uses: sonarsource/sonarcloud-github-action@master
      with:
        args: >
          -Dsonar.projectKey=api-pui
          -Dsonar.organization=gutimoody-byte
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.login=${{ secrets.SONAR_TOKEN }}

    # 📦 SCA con OWASP Dependency-Check
    - name: SCA - OWASP Dependency-Check
      uses: dependency-check/Dependency-Check_Action@main
      with:
        project: "API-PUI"
        scan: "."
        format: "HTML"
        out: "reports/dependency-check"

    # 📤 Subir reporte de SCA como artefacto
    - name: Upload Dependency-Check report
      uses: actions/upload-artifact@v3
      with:
        name: dependency-check-report
        path: reports/dependency-check

    # 🌐 DAST con OWASP ZAP (puedes comentar si falla por login)
    - name: DAST - OWASP ZAP Baseline Scan
      uses: zaproxy/action-baseline@v0.6.0
      with:
        target: "https://www.fnhermes.com.mx/pui/api/pui/login"
        rules: "zap-rules.tsv"
        cmd_options: "-a"
